services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cornerstone_church
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - church-postgres:/var/lib/postgresql/data

volumes:
  church-postgres:
