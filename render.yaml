services:
  - type: web
    name: cornerstone-global-harvest-church
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm ci --include=dev --prefix server && npm ci --include=dev --prefix client && npm run db:generate --prefix server && npm run build --prefix client
    startCommand: node server/deploy-start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CHURCH_NAME
        value: Cornerstone Global Harvest Church
      - key: ADMIN_NAME
        value: Church Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ccornerstoneglobalharvest@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Cornerstone Global Harvest Church <ccornerstoneglobalharvest@gmail.com>
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-6-luna
